# The papers of this hub, one [[paper]] per repository to be, grouped by family of methods:
# estimating a tree from sequences, typically one alignment or locus.
#
# Started on 2026-11-25 from the maintainer's checklist and its expansion. Authors, years, titles and
# links are the lists', checked against Crossref, which gave the links that the lists lacked. Each
# formalization records the exact citation in its Phase 0, and corrects the entry here. Jukes and
# Cantor's chapter "Evolution of Protein Molecules" (in H. N. Munro (ed.), Mammalian Protein
# Metabolism III, Academic Press, 1969), the source of the JC69 model, is the source of a foundation
# (the root's sequence models), not a paper of this catalog.
#
# Fields of a paper:
#   id          the repository is lean4-<id>: the method's name in lower case when the paper names
#               one, otherwise first author and year, with a keyword when two papers would share it
#   family      the 

[[family]]
id = 1
title = "Maximum likelihood and tree-search algorithms"
priority = "highest"

[[family]]
id = 2
title = "Distance-based inference and minimum evolution"

[[family]]
id = 3
title = "Molecular substitution models"
priority = "foundational"

[[family]]
id = 4
title = "Substitution-model selection and adequacy"

[[family]]
id = 5
title = "Maximum parsimony"

[[family]]
id = 6
title = "Bayesian phylogenetic inference and MCMC"

[[family]]
id = 7
title = "Branch support, rooting and hypothesis testing"

[[family]]
id = 8
title = "Large-scale divide-and-conquer reconstruction"

