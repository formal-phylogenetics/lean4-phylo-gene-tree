# The papers of this hub, one [[paper]] per repository to be, grouped by family of methods: estimating a tree from sequences, typically one alignment or locus.
#
# Started on 2026-11-25 from the maintainer's checklist and its expansion. Authors, years, titles and
# links are the lists', checked against Crossref, which gave the links that the lists lacked. Each
# formalization records the exact citation in its Phase 0, and corrects the entry here. Jukes and
# Cantor's chapter "Evolution of Protein Molecules" (in H. N. Munro (ed.), Mammalian Protein
# Metabolism III, Academic Press, 1969), the source of the JC69 model, is the source of a foundation
# (the root's sequence models), not a paper of this catalog.
#
# Fields of a paper:
#   id          the repository is lean4-<id>: the method's name in lower case when the paper names
#               one, otherwise first author and year, with a keyword when two papers would share it
#   family      the [[family]] it belongs to (each paper is in exactly one)
#   order       its place in the family, by priority
#   short       the method's name, when it has one
#   kind        "theory" (an identifiability, consistency or characterization theorem),
#               "theory+algorithm", "theory+method", or "method"
#   root        the Lean package, the root of its code and, by default, the paper's name: the
#               method's name, otherwise first author and year (lean4-phylogenetics'
#               docs/CONVENTIONS.md, Section 2)
#   paper       optional: the paper's name, when it is not the root (CONVENTIONS, Section 2)
#   status      "todo", "partial" (some results are formalized elsewhere: see covered_by),
#               "in-progress" (its repository exists), or "formalized"
#   repo        only when the repository is not named lean4-<id>, as for papers on one topic that
#               share a repository (CONVENTIONS, Section 3)
#   commit      for a formalized paper: the commit that other repositories require
#   uses        other hubs whose library its formalization requires, besides this one
#   builds_on   ids of papers, of any hub's catalog, whose results its proofs use. Only what is known
#               before the paper's inventory; its Phase 1 completes the list here
#   covered_by  what is already formalized, and where
#   note        anything else

[[family]]
id = 1
title = "Maximum likelihood and substitution-model identifiability"
priority = "highest"

[[family]]
id = 2
title = "Distance-based inference and minimum evolution"

[[family]]
id = 3
title = "Maximum parsimony and character-based inference"
priority = "high"

[[family]]
id = 4
title = "Bayesian phylogenetic inference"

[[family]]
id = 5
title = "Branch support, rooting and statistical hypothesis testing"

[[family]]
id = 6
title = "Supporting combinatorial reconstruction theory"

[[family]]
id = 7
title = "Fast-converging phylogenetic reconstruction"
priority = "highest"

[[family]]
id = 8
title = "Molecular substitution models"
priority = "foundational"

[[family]]
id = 9
title = "Algebraic phylogenetics, invariants and identifiability"
priority = "highest"

[[family]]
id = 10
title = "Statistical consistency and model misspecification"

[[family]]
id = 11
title = "Substitution-model selection and model adequacy"

[[family]]
id = 12
title = "Large-scale divide-and-conquer reconstruction"

